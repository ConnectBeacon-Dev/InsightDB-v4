
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}

http {
    # Basic logs
    access_log  logs/access.log;
    error_log   logs/error.log;
    
    # Fix for long server names
    server_names_hash_bucket_size 64;

    # Upstream to your apps
    upstream login_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }
    
    upstream chatbot_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    # WebSockets (if your app uses them)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
		
    # Login Server
    server {
        listen              443 ssl;
        http2               on;
        server_name         login.aichatbot.schemes.ddpdashboard.gov.in;

        ssl_certificate     "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5.pem";
        ssl_certificate_key "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5-key.pem";

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass                          http://login_backend;
            proxy_http_version                   1.1;
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   https;
            proxy_set_header Connection          "";
            proxy_buffering                      off;
            proxy_read_timeout                   300s;
            proxy_send_timeout                   300s;
        }
    }

    # Chatbot Server
    server {
        listen              443 ssl;
        http2               on;
        server_name         chat.aichatbot.schemes.ddpdashboard.gov.in;

        ssl_certificate     "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5.pem";
        ssl_certificate_key "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5-key.pem";

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass                          http://chatbot_backend;
            proxy_http_version                   1.1;
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   https;
            proxy_set_header Connection          "";
            proxy_buffering                      off;
            proxy_read_timeout                   300s;
            proxy_send_timeout                   300s;
        }

        location /ws {
            proxy_pass            http://chatbot_backend;
            proxy_http_version    1.1;
            proxy_set_header      Upgrade $http_upgrade;
            proxy_set_header      Connection $connection_upgrade;
            proxy_set_header      Host $host;
        }
    }

    # Shortcut redirect: schemes.ddpdashboard.gov.in/aichatbot -> login
    server {
        listen              443 ssl;
        http2               on;
        server_name         schemes.ddpdashboard.gov.in;

        ssl_certificate     "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5.pem";
        ssl_certificate_key "D:/CBDPIT/RELEASE/OCT17/InsightDB-v4/docs/deploy/local/certs/schemes.ddpdashboard.gov.in+5-key.pem";

        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location /aichatbot {
            return 301 https://login.aichatbot.schemes.ddpdashboard.gov.in;
        }

        location / {
            return 404;
        }
    }

    # Optional HTTP→HTTPS redirect (only if you want it)
    server {
        listen      80;
        server_name schemes.ddpdashboard.gov.in login.aichatbot.schemes.ddpdashboard.gov.in chat.aichatbot.schemes.ddpdashboard.gov.in;
        return 301 https://$host$request_uri;
    }
}
