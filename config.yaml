# InsightDB SSO & Session Configuration
# This file contains all session and SSO-related settings
# Environment variables will override these defaults if set
#
# IMPORTANT: Secret is loaded from .env.production (generated by deploy.py)
# Both local and production use the SAME SSO flow!

# Production URLs - Change these for your deployment
urls:
  login: "https://login.aichatbot.schemes.ddpdashboard.gov.in"
  chatbot: "https://chat.aichatbot.schemes.ddpdashboard.gov.in/aichat"
  chatbot_sso: "https://chat.aichatbot.schemes.ddpdashboard.gov.in/aichat/sso"

# SSO Configuration
sso:
  # Shared secret for SSO token verification (REQUIRED)
  # MUST be set via SSO_SHARED_SECRET environment variable
  # Generated automatically by deploy.py and saved to .env.production
  secret: null  # ALWAYS use environment variable (from .env.production)
  expect_issuer: "ddpdashboard-aichatbot-portal"
  expect_audience: "aichat"
  portal_url: "http://127.0.0.1:5000/askme-sso"  # Local login server

# Cookie Configuration
cookie:
  name: "aichat_sid"
  domain: null  # null = current domain only (works for both local and production)
  secure: true  # true for HTTPS production (required for SameSite=None)
  samesite: "None"  # None allows cookies in iframe context with HTTPS
  path: "/"  # "/" allows cookie to work for all paths (including /api/chatbot-login)

# Session Timeouts (in seconds)
session:
  ttl_idle: 1800    # 30 minutes - session expires after this period of inactivity
  ttl_absolute: 28800  # 8 hours - maximum session duration regardless of activity

# Redis Configuration
redis:
  url: "redis://127.0.0.1:6379/0"
  use_fake_redis: true  # true = use fakeredis (in-memory), false = use real Redis
